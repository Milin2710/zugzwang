# Production stack for one VM:  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# MongoDB lives in Atlas; Redis runs here and is NOT exposed to the internet.
services:
  redis:
    image: redis:7-alpine
    # append-only file: a VM reboot or container restart keeps live games and the queue
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped

  server:
    build: ../server
    environment:
      NODE_ENV: production
      PORT: "4000"
      REDIS_URL: redis://redis:6379
      MONGODB_URI: ${MONGODB_URI}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CORS_ORIGINS: https://${APP_DOMAIN}
    depends_on: [redis]
    restart: unless-stopped

  client:
    build:
      context: ../client
      args:
        NEXT_PUBLIC_BACKEND_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [client, server]
    restart: unless-stopped

volumes:
  redis-data:
  caddy-data:
  caddy-config:
